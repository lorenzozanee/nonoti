name: Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed APK and release draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            printf '%s\n' 'Expected vX.Y.Z or vX.Y.Z-alpha.N / beta.N / rc.N.' >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf '%s\n' 'Run manual releases from the default branch.' >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      - name: Check tests, lint and Debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NONOTI_KEYSTORE_BASE64 }}
          NONOTI_STORE_PASSWORD: ${{ secrets.NONOTI_STORE_PASSWORD }}
          NONOTI_KEY_ALIAS: ${{ secrets.NONOTI_KEY_ALIAS }}
          NONOTI_KEY_PASSWORD: ${{ secrets.NONOTI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 NONOTI_STORE_PASSWORD NONOTI_KEY_ALIAS NONOTI_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              printf 'Missing release secret: %s\n' "$variable" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nonoti-release.keystore"

      - name: Build signed Release APK
        env:
          NONOTI_KEYSTORE_PATH: ${{ runner.temp }}/nonoti-release.keystore
          NONOTI_STORE_PASSWORD: ${{ secrets.NONOTI_STORE_PASSWORD }}
          NONOTI_KEY_ALIAS: ${{ secrets.NONOTI_KEY_ALIAS }}
          NONOTI_KEY_PASSWORD: ${{ secrets.NONOTI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache

      - name: Verify APK version and fixed certificate
        shell: bash
        run: |
          set -euo pipefail
          metadata=app/build/outputs/apk/release/output-metadata.json
          version="${RELEASE_TAG#v}"
          apk_name="$(jq -er --arg version "$version" '
            select(.applicationId == "com.example.nonoti") |
            .elements | select(length == 1) | .[0] |
            select(.versionName == $version and .versionCode > 0) | .outputFile
          ' "$metadata")"
          apk="app/build/outputs/apk/release/$apk_name"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/release-certificate.txt"
          actual="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/release-certificate.txt" | sort -u)"
          expected="$(tr -d '\r\n' < .github/release-signing-certificate.sha256)"
          test "$actual" = "$expected"
          mkdir -p release-assets
          cp "$apk" "release-assets/NoNoTi-$RELEASE_TAG-release.apk"
          (
            cd release-assets
            sha256sum "NoNoTi-$RELEASE_TAG-release.apk" > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          jq '{applicationId, elements: [.elements[] | {versionCode, versionName}]}' "$metadata" \
            > release-assets/version.json
          {
            printf '### %s\n\n' "$RELEASE_TAG"
            printf 'Commit: %s\n\n' "$(git rev-parse HEAD)"
            printf 'Signing certificate SHA-256: %s\n' "$actual"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release draft with APK and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --generate-notes \
            --title "NoNoTi $RELEASE_TAG" "${prerelease[@]}" \
            release-assets/*

      - name: Remove signing key and configuration cache
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/nonoti-release.keystore"
          rm -rf .gradle/configuration-cache

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 14
